name: runner-probe
# 一次性探针：这仓库能用哪些 macOS runner 标签。手动触发，只跑 uname，几十秒。
# 用完可以删掉；不被 xnu.yml 引用。
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-13
          - macos-14
          - macos-14-intel
          - macos-14-large
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-latest
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: whoami
        run: |
          echo "runner: $RUNNER_NAME  arch: $(uname -m)"
          sw_vers
          ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | head -3
